<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#1a1a20"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c6f135" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38e1c8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#bg)"/>
  <rect width="400" height="400" rx="200" fill="url(#glow)"/>
  <circle cx="200" cy="200" r="198" fill="none" stroke="#c6f135" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#c6f135" stroke-width="0.5" opacity="0.08"/>
  <!-- Abstract avatar silhouette -->
  <ellipse cx="200" cy="170" rx="50" ry="52" fill="rgba(198,241,53,0.06)" stroke="rgba(198,241,53,0.15)" stroke-width="1"/>
  <ellipse cx="200" cy="260" rx="80" ry="45" fill="rgba(198,241,53,0.04)" stroke="rgba(198,241,53,0.1)" stroke-width="0.5"/>
  <!-- Decorative elements -->
  <rect x="140" y="80" width="120" height="2" rx="1" fill="#c6f135" opacity="0.1"/>
  <rect x="160" y="90" width="80" height="2" rx="1" fill="#c6f135" opacity="0.06"/>
  <text x="200" y="348" text-anchor="middle" fill="rgba(198,241,53,0.3)" font-family="Space Grotesk, sans-serif" font-size="11" letter-spacing="4" font-weight="600">R T</text>
</svg>
